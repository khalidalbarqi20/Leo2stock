name: Continuous Scanner Trigger

on:
  schedule:
    - cron: '*/10 * * * *'   # كل 10 دقائق — عدّلها حسب حاجتك (لاحظ توقيت GitHub Actions بتوقيت UTC)
  workflow_dispatch: {}       # يسمح بتشغيل يدوي من تبويب Actions للاختبار

jobs:
  trigger-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Call scan-all endpoint
        run: |
          curl -sf -X POST "${{ secrets.LEO2STOCK_URL }}/api/cron/scan-all" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -o response.json -w "\nHTTP %{http_code}\n"
          cat response.json
